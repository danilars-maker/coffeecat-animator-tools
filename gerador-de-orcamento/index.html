<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Gerador de orçamento · Coffee Cat Studio</title>
<meta name="description" content="Gerador de orçamento gratuito para animadores: preencha o projeto, o valor por segundo ou por diária e as condições, e baixe uma proposta em PDF pronta para mandar ao estúdio.">
<link rel="canonical" href="https://coffeecat.com.br/ferramentas/gerador-de-orcamento/">
<meta property="og:title" content="Gerador de orçamento · Coffee Cat Studio">
<meta property="og:image" content="https://coffeecat.com.br/assets/compartilhar.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
/* VOICE: calm, trustworthy paperwork helper for animators who dislike paperwork
   IDEA: a printed quote on letter paper, filled in live beside the form
   PICTURE: the A4 proposal itself, with its blue header rule and totals box
   COLOUR and TYPE: light grey page, white paper, slate ink, animator's blue pencil; Fredoka + Nunito
   LAYOUT: form in calm stacked sections left, sticky paper preview right; stacks on phones */
:root{color-scheme:light dark;
--bg:light-dark(#f3f5f8,#1a1f27);--ink:light-dark(#2b3440,#e8edf3);--soft:light-dark(#647083,#9aa6b8);
--band:light-dark(#e4e9f0,#222833);--card:light-dark(#ffffff,#262d38);--line:light-dark(#d6dde7,#38424f);
--blue:light-dark(#2563eb,#6ea0ff);--blueink:light-dark(#ffffff,#0c1730);--sel:light-dark(#dbe7ff,#24365e)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 Nunito,system-ui,sans-serif;overflow-x:clip}
.band{padding:clamp(20px,3vw,40px) max(4vw,14px)}
.wrap{max-width:1320px;margin:0 auto}
h1,h2,h3{font-family:Fredoka,Nunito,sans-serif;font-weight:600;line-height:1.05;margin:0;text-wrap:balance}
.top{background:var(--band)}
.bar{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center;margin-bottom:18px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;color:var(--soft)}
.brand svg{width:30px;height:30px;flex:none}
.tright{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.home{display:inline-flex;align-items:center;gap:8px;min-height:44px;padding:0 14px;border-radius:999px;background:var(--card);color:var(--ink);font-weight:800;font-size:14px;text-decoration:none}
.home:hover{color:var(--blue)}
.langs{display:flex;gap:4px;background:var(--card);border-radius:999px;padding:4px}
.langs button{all:unset;cursor:pointer;padding:8px 14px;border-radius:999px;font-weight:700;font-size:14px;color:var(--soft)}
.langs button[aria-pressed=true]{background:var(--blue);color:var(--blueink)}
h1{font-size:clamp(30px,4.4vw,48px)}
.lede{color:var(--soft);max-width:70ch;margin:8px 0 0;font-size:17px}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;background:var(--card);border:2px solid var(--line);font-weight:800;font-size:15px;white-space:nowrap}
.btn:hover{border-color:var(--blue)}
.btn.pri{background:var(--blue);border-color:var(--blue);color:var(--blueink)}
.btn.warn{border-color:#e23a46;color:#e23a46}
.btn.small{min-height:36px;padding:0 12px;font-size:14px}
.btn svg{width:18px;height:18px;flex:none}
.import{margin-top:16px;display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--card);border-radius:14px;padding:10px 14px}
.import p{margin:0;font-size:14px;color:var(--soft);flex:1 1 260px}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px;align-items:start}
.form{display:grid;gap:14px}
.sec{background:var(--card);border-radius:18px;padding:16px 18px}
.sec h2{font-size:20px;margin-bottom:12px;display:flex;align-items:center;gap:10px}
.num{flex:none;width:26px;height:26px;border-radius:50%;background:var(--ink);color:var(--bg);display:grid;place-items:center;font-size:13px;font-family:Nunito,sans-serif;font-weight:800}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.full{grid-column:1/-1}
.f{display:flex;flex-direction:column;gap:4px}
.f span{font-size:13px;font-weight:700;color:var(--soft)}
.f input,.f textarea,.f select{font:inherit;font-size:16px;font-weight:700;color:var(--ink);background:var(--bg);border:2px solid var(--line);border-radius:10px;padding:8px 10px;min-height:44px;width:100%}
.f textarea{min-height:76px;resize:vertical;font-weight:600;line-height:1.4}
.f input:focus,.f textarea:focus,.f select:focus{border-color:var(--blue);outline:none}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{all:unset;cursor:pointer;min-height:40px;padding:0 12px;display:inline-grid;place-items:center;border-radius:10px;background:var(--bg);font-weight:800;font-size:14px;border:2px solid transparent}
.chip[aria-pressed=true]{background:var(--blue);color:var(--blueink)}
.lbl{font-size:13px;font-weight:700;color:var(--soft);display:block;margin:4px 0 6px}
.hint{color:var(--soft);font-size:13px;margin:6px 0 0}
.tech{margin-top:10px;font-size:14px;background:var(--bg);border-radius:10px;padding:8px 12px;color:var(--soft)}
.tech b{color:var(--ink)}
.extra{display:grid;grid-template-columns:minmax(0,1fr) 8em 44px;gap:8px;align-items:end;margin-bottom:8px}
.del{all:unset;cursor:pointer;width:44px;height:44px;display:grid;place-items:center;border-radius:10px;color:var(--soft);font-size:22px;font-weight:800}
.del:hover{color:#e23a46;background:var(--bg)}
.side{position:sticky;top:12px;display:grid;gap:12px}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.paperbox{background:var(--band);border-radius:18px;padding:clamp(10px,2vw,22px)}
.paper{background:#fff;color:#1f2733;aspect-ratio:210/297;width:100%;border-radius:4px;box-shadow:0 10px 30px rgba(20,30,50,.18);padding:6.5% 7.5%;font-family:Nunito,Arial,sans-serif;font-size:clamp(8px,1.05vw,12.5px);line-height:1.38;overflow:hidden;display:flex;flex-direction:column}
.paper .ph{display:flex;justify-content:space-between;align-items:flex-start;gap:1em;border-bottom:.25em solid #2563eb;padding-bottom:.8em;margin-bottom:1em}
.paper .pt{font-family:Fredoka,Nunito,sans-serif;font-weight:600;font-size:2.1em;line-height:1}
.paper .pn{text-align:right;color:#647083;font-size:.95em}
.paper .pn b{color:#1f2733}
.paper .who{display:grid;grid-template-columns:1fr 1fr;gap:1.4em;margin-bottom:1em}
.paper .k{font-size:.78em;font-weight:800;letter-spacing:.06em;color:#647083;text-transform:uppercase;margin-bottom:.2em}
.paper .who p{margin:0}
.paper h4{font-size:1.02em;margin:.9em 0 .35em;font-weight:800;color:#2563eb}
.paper .desc{white-space:pre-wrap;margin:0}
.paper table{width:100%;border-collapse:collapse;margin-top:.2em}
.paper td,.paper th{padding:.38em .4em;border-bottom:1px solid #d6dde7;text-align:left;vertical-align:top}
.paper th{font-size:.8em;color:#647083;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.paper td.r,.paper th.r{text-align:right;white-space:nowrap}
.paper .tot td{border-bottom:0;font-weight:800}
.paper .grand td{background:#2563eb;color:#fff;font-size:1.15em}
.paper ul{margin:0;padding-left:1.2em}
.paper .sign{margin-top:auto;padding-top:1.4em;display:grid;grid-template-columns:1fr 1fr;gap:2em}
.paper .sign div{border-top:1px solid #1f2733;padding-top:.3em;font-size:.9em;color:#647083}
.paper .foot{font-size:.75em;color:#9aa6b8;margin-top:.8em}
.msg{font-size:14px;color:var(--soft);margin:0}
footer{color:var(--soft);font-size:14px}
.bmcbox{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;background:var(--card);border-radius:18px;padding:18px 20px}
.bmcbox p{margin:0;max-width:60ch}.bmcbox b{color:var(--ink);font-size:17px}
.bmc{display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 20px;border-radius:14px;background:#ffdd00;color:#2b3440;font-weight:800;text-decoration:none}
footer a{color:var(--blue)}
.credit{margin-top:14px}
@media(max-width:980px){.main{grid-template-columns:minmax(0,1fr)}.side{position:static}}
@media(max-width:560px){.grid2,.grid3{grid-template-columns:minmax(0,1fr)}.paper{font-size:2.2vw}.extra{grid-template-columns:minmax(0,1fr) 6.5em 44px}}
@media(max-width:420px){.home span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}}
</style>
</head>
<body>
<header class="band top"><div class="wrap">
  <div class="bar">
    <div class="brand"><svg viewBox="0 0 40 40" aria-hidden="true"><path d="M8 16h20v10a8 8 0 0 1-8 8h-4a8 8 0 0 1-8-8z" fill="#2563eb"/><path d="M28 18h3a4 4 0 0 1 0 8h-3" fill="none" stroke="#2563eb" stroke-width="3"/><path d="M11 16l2-6 4 5M25 16l-2-6-4 5" fill="#2563eb"/><circle cx="15" cy="23" r="1.6" fill="#fff"/><circle cx="21" cy="23" r="1.6" fill="#fff"/></svg><span>Coffee Cat Studio · <span data-t="brand"></span></span></div>
    <div class="tright">
      <a class="home" href="https://coffeecat.com.br/"><svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M3 11.5 12 4l9 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M5.5 10v9.5h5v-5h3v5h5V10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linejoin="round"/></svg><span>Coffee Cat</span></a>
      <div class="langs" role="group" aria-label="Idioma"><button data-lang="pt">PT</button><button data-lang="en">EN</button><button data-lang="es">ES</button></div>
    </div>
  </div>
  <h1 data-t="title"></h1>
  <p class="lede" data-t="lede"></p>
  <div class="import" id="importBox" hidden><p data-t="importP"></p><button class="btn pri small" id="importBtn" data-t="importBtn"></button></div>
</div></header>

<main class="band"><div class="wrap main">
  <div class="form">
    <section class="sec"><h2><span class="num">1</span><span data-t="s1"></span></h2>
      <div class="grid2">
        <label class="f"><span data-t="meName"></span><input data-k="me.name" maxlength="80"></label>
        <label class="f"><span data-t="meEmail"></span><input data-k="me.email" maxlength="80" inputmode="email"></label>
        <label class="f"><span data-t="mePhone"></span><input data-k="me.phone" maxlength="40" inputmode="tel"></label>
        <label class="f"><span data-t="meSite"></span><input data-k="me.site" maxlength="80"></label>
        <label class="f full"><span data-t="meDoc"></span><input data-k="me.doc" maxlength="60"></label>
      </div></section>

    <section class="sec"><h2><span class="num">2</span><span data-t="s2"></span></h2>
      <div class="grid2">
        <label class="f"><span data-t="cliCompany"></span><input data-k="cli.company" maxlength="80"></label>
        <label class="f"><span data-t="cliContact"></span><input data-k="cli.contact" maxlength="80"></label>
        <label class="f full"><span data-t="cliEmail"></span><input data-k="cli.email" maxlength="80" inputmode="email"></label>
      </div></section>

    <section class="sec"><h2><span class="num">3</span><span data-t="s3"></span></h2>
      <label class="f"><span data-t="projTitle"></span><input data-k="proj.title" maxlength="90"></label>
      <span class="lbl" data-t="projType"></span><div class="chips" id="types"></div>
      <label class="f" style="margin-top:10px"><span data-t="projDesc"></span><textarea data-k="proj.desc" maxlength="900"></textarea></label>
      <div class="grid3" style="margin-top:10px">
        <label class="f"><span data-t="min"></span><input data-k="tech.min" inputmode="numeric"></label>
        <label class="f"><span data-t="sec"></span><input data-k="tech.sec" inputmode="decimal"></label>
        <label class="f"><span data-t="expL"></span><select data-k="tech.exp" id="expSel"></select></label>
      </div>
      <span class="lbl" data-t="fpsL"></span><div class="chips" id="fps"></div>
      <div class="tech" id="techLine"></div></section>

    <section class="sec"><h2><span class="num">4</span><span data-t="s4"></span></h2>
      <div class="chips" id="pay"></div>
      <div class="grid3" style="margin-top:10px">
        <label class="f" id="rateF"><span data-t="rateL"></span><input data-k="rate" inputmode="decimal"></label>
        <label class="f" id="dailyF"><span data-t="dailyL"></span><input data-k="daily" inputmode="decimal"></label>
        <label class="f" id="daysF"><span data-t="daysL"></span><input data-k="days" inputmode="numeric"></label>
        <label class="f"><span data-t="curL"></span><select data-k="cur"><option value="BRL">R$ · BRL</option><option value="USD">US$ · USD</option><option value="EUR">€ · EUR</option></select></label>
      </div>
      <span class="lbl" style="margin-top:12px" data-t="extrasL"></span>
      <div id="extras"></div>
      <button class="btn small" id="addExtra">+ <span data-t="addExtra"></span></button>
      <div class="grid3" style="margin-top:12px"><label class="f"><span data-t="discL"></span><input data-k="disc" inputmode="decimal" placeholder="0"></label></div>
    </section>

    <section class="sec"><h2><span class="num">5</span><span data-t="s5"></span></h2>
      <div class="grid3">
        <label class="f"><span data-t="numL"></span><input data-k="num" maxlength="20"></label>
        <label class="f"><span data-t="dateL"></span><input data-k="date" type="date"></label>
        <label class="f"><span data-t="validL"></span><input data-k="validity" inputmode="numeric"></label>
        <label class="f"><span data-t="deadL"></span><input data-k="deadline" inputmode="numeric"></label>
        <label class="f"><span data-t="revL"></span><input data-k="revisions" inputmode="numeric"></label>
        <label class="f"><span data-t="payTL"></span><select data-k="payterms" id="payTerms"></select></label>
        <label class="f full" id="payCustomF"><span data-t="payCustomL"></span><input data-k="payCustom" maxlength="140"></label>
        <label class="f full"><span data-t="notesL"></span><textarea data-k="notes" maxlength="900"></textarea></label>
      </div></section>
  </div>

  <aside class="side">
    <div class="acts">
      <button class="btn pri" id="pdf"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 4v12M6 10l6 6 6-6M4 20h16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg><span data-t="pdf"></span></button>
      <button class="btn" id="copy" data-t="copy"></button>
      <button class="btn warn" id="clear" data-t="clear"></button>
    </div>
    <p class="msg" id="msg" aria-live="polite"></p>
    <div class="paperbox"><div class="paper" id="paper" role="img"></div></div>
    <p class="msg" data-t="autosave"></p>
  </aside>
</div></main>

<footer class="band"><div class="wrap">
  <div class="bmcbox"><p><b data-t="bmcTitle"></b><br><span data-t="bmcLede"></span></p>
    <a class="bmc" href="https://buymeacoffee.com/studiocoffeecat" target="_blank" rel="noopener"><span data-t="bmc"></span></a></div>
  <div class="credit"><span data-t="footer"></span> <a href="https://coffeecat.com.br">coffeecat.com.br</a></div>
</div></footer>

<script src="jspdf.umd.min.js"></script>

  else if(b.id==='copy'){const t=plainText();try{navigator.clipboard.writeText(t).then(()=>msg(L().copied),()=>msg(L().copyFail))}catch(err){msg(L().copyFail)}}
  else if(b.id==='clear'){if(b.dataset.arm){const lang=S.lang,me=S.me;S=blank();S.lang=lang;S.me=me;delete b.dataset.arm;staticText()}
    else{b.dataset.arm=1;b.textContent=L().clear2;setTimeout(()=>{delete b.dataset.arm;b.textContent=L().clear},3000)}}
});
document.addEventListener('input',e=>{const t=e.target;
  if(t.dataset.k){set(t.dataset.k,t.dataset.k==='tech.fps'?+t.value:t.value);render()}
  else if(t.dataset.x!==undefined){S.extras[+t.dataset.x][t.dataset.xf]=t.value;render()}});
document.addEventListener('change',e=>{const t=e.target;if(t.tagName==='SELECT'&&t.dataset.k){set(t.dataset.k,t.value);render()}});
staticText();
}
</script>
</body>
</html>
